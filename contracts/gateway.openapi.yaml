openapi: 3.1.0
info:
  title: STUD'RP GATEWAY — Point d'entrée unique
  version: 1.0.0-draft
  summary: Authentification, bus d'événements, santé et documentation.
  description: |
    La gateway (Node.js / Fastify, équipe 6) est le **seul point d'entrée** de STUD'RP.

    ## Routage
    | Préfixe public | Service |
    |---|---|
    | `/api/stud/...` | STUD (Student + Alumni) |
    | `/api/back/...` | ASSO BACK |
    | `/api/rms/...` | ASSO RMS |
    | `/api/admin/...` | STUD'RP ADMIN |
    | `/api/money/...` | STUD'RP MONEY |

    La gateway retire `/api/{service}` et transmet le reste. Exemple :
    `GET /api/back/v1/associations/cnamus/catalog/items` → `GET {BACK_URL}/v1/associations/cnamus/catalog/items`.

    ## Ce que la gateway ajoute à chaque requête transmise
    | En-tête | Contenu |
    |---|---|
    | `X-Request-Id` | Identifiant de corrélation (créé s'il manque) |
    | `X-User-Id` | `sub` du JWT, ou nom du service appelant |
    | `X-User-Role` | `STUDENT`, `BUREAU`, `STUDRP_ADMIN` ou `SERVICE` |
    | `X-Association` | Association du jeton |
    | `X-Gateway-Secret` | Secret partagé : prouve au service que la requête vient de la gateway |

    Les en-têtes `X-User-*`, `X-Association` et `X-Gateway-Secret` envoyés par un client sont supprimés.

    ## Événements
    Les services publient avec `POST /api/events`. La gateway livre ensuite chaque événement
    à ses abonnés (`subscriptions.yaml`) sur `POST /v1/webhooks/events`, signé en HMAC-SHA256.
    Chaque type d'événement est documenté dans la section **Webhooks** ci-dessous.

    ## Documentation
    `GET /docs` sert le portail Scalar regroupant les 6 contrats ;
    `GET /docs/openapi/{service}.yaml` sert chaque contrat assemblé.
servers:
  - url: https://api.studrp.example
    description: Production (adresse à fournir par l'équipe 7)
  - url: http://localhost:8080
    description: Développement local
tags:
  - name: Authentification
  - name: Événements
    description: Publication, journal, suivi et rejeu des livraisons.
  - name: Santé
  - name: Catalogue d'événements
    description: Un webhook par type d'événement, tel que reçu par les abonnés.
paths:
  /api/auth/login:
    post:
      tags: [Authentification]
      operationId: login
      summary: Se connecter
      description: |
        La gateway délègue la vérification du mot de passe à STUD (`realm=student`) ou à
        ADMIN (`realm=staff`) puis signe un JWT valable 1 h. Limité à 10 tentatives par
        minute et par adresse IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { association: cnamus, email: lea.martin@cnam.example, password: un-mot-de-passe-solide, realm: student }
      responses:
        '200':
          description: Connexion réussie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIzZjFjMmE4ZSJ9.signature
                tokenType: Bearer
                expiresIn: 3600
                user: { userId: 3f1c2a8e-7b6d-4e15-9c4a-1d2e3f4a5b6c, role: STUDENT, association: cnamus, name: Léa Martin }
        '401': { $ref: './common/schemas.yaml#/components/responses/Unauthorized' }
        '422': { $ref: './common/schemas.yaml#/components/responses/Unprocessable' }

  /api/auth/me:
    get:
      tags: [Authentification]
      operationId: getCurrentUser
      summary: Qui suis-je ?
      description: Renvoie l'identité portée par le jeton. Utile aux fronts au chargement.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Identité.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
              example: { userId: 3f1c2a8e-7b6d-4e15-9c4a-1d2e3f4a5b6c, role: STUDENT, association: cnamus, name: Léa Martin }
        '401': { $ref: './common/schemas.yaml#/components/responses/Unauthorized' }

  /api/events:
    post:
      tags: [Événements]
      operationId: publishEvent
      summary: Publier un événement
      description: |
        Réservé aux services (`X-Api-Key`). La gateway vérifie que `source` correspond au
        service de la clé et que ce service a le droit d'émettre ce `type`
        (`subscriptions.yaml`), enregistre l'événement puis répond `202` avant de le livrer.
        Republier le même `id` ne crée pas de doublon (`200`, `duplicate: true`).
      security:
        - serviceApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './common/events.yaml#/components/schemas/EventEnvelope' }
            example:
              id: 0b6c2f0e-6a4b-4a43-9d3c-2a6f8f0c1d11
              type: sale.recorded
              version: 1
              source: rms
              association: cnamus
              occurredAt: '2026-11-10T10:42:00Z'
              correlationId: b2e4c6a8-1f0d-4c55-8a7e-3c9d2e1f0a77
              data:
                saleId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                eventId: 6c5d4e3f-2a1b-4c0d-9e8f-7a6b5c4d3e2f
                studentId: 3f1c2a8e-7b6d-4e15-9c4a-1d2e3f4a5b6c
                paymentMethod: ACCOUNT
                accountTransactionId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                paymentId: null
                totalCents: 50
                lines:
                  - { itemId: 7e6f5a4b-3c2d-4e1f-8a9b-0c1d2e3f4a5b, label: Café, quantity: 1, unitPriceCents: 50, priceTier: MEMBER, vatRate: 0.2, totalCents: 50 }
                soldAt: '2026-11-10T10:42:00Z'
      responses:
        '200':
          description: Événement déjà reçu, rien n'est refait.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishAck' }
              example: { eventId: 0b6c2f0e-6a4b-4a43-9d3c-2a6f8f0c1d11, duplicate: true, subscribers: [back, stud, admin] }
        '202':
          description: Événement accepté, livraison en cours.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishAck' }
              example: { eventId: 0b6c2f0e-6a4b-4a43-9d3c-2a6f8f0c1d11, duplicate: false, subscribers: [back, stud, admin] }
        '400': { $ref: './common/schemas.yaml#/components/responses/BadRequest' }
        '401': { $ref: './common/schemas.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common/schemas.yaml#/components/responses/Forbidden' }
        '422': { $ref: './common/schemas.yaml#/components/responses/Unprocessable' }
    get:
      tags: [Événements]
      operationId: listEvents
      summary: Consulter le journal des événements
      description: |
        Journal de tout ce qui a été échangé. Sert au débogage, à la démo et aux livrables
        « données transmises » (filtre `source`) et « données reçues » (filtre `subscriber`).
        `format=ndjson` renvoie une ligne JSON par événement, pratique pour un export.
        Rôles `STUDRP_ADMIN`, `SERVICE`.
      security:
        - bearerAuth: []
        - serviceApiKey: []
      parameters:
        - name: association
          in: query
          schema: { $ref: './common/schemas.yaml#/components/schemas/AssociationSlug' }
          example: cnamus
        - name: type
          in: query
          schema: { $ref: './common/events.yaml#/components/schemas/EventType' }
        - name: source
          in: query
          description: Service émetteur.
          schema: { $ref: './common/events.yaml#/components/schemas/ServiceName' }
        - name: subscriber
          in: query
          description: Service abonné (événements qui lui ont été livrés).
          schema: { $ref: './common/events.yaml#/components/schemas/ServiceName' }
        - name: format
          in: query
          schema: { type: string, enum: [json, ndjson], default: json }
        - $ref: './common/schemas.yaml#/components/parameters/From'
        - $ref: './common/schemas.yaml#/components/parameters/To'
        - $ref: './common/schemas.yaml#/components/parameters/Page'
        - $ref: './common/schemas.yaml#/components/parameters/PageSize'
      responses:
        '200':
          description: Page d'événements.
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LoggedEvent' }
                  pagination: { $ref: './common/schemas.yaml#/components/schemas/Pagination' }
              example:
                data:
                  - event:
                      id: 0b6c2f0e-6a4b-4a43-9d3c-2a6f8f0c1d11
                      type: sale.recorded
                      version: 1
                      source: rms
                      association: cnamus
                      occurredAt: '2026-11-10T10:42:00Z'
                      data: { saleId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d, totalCents: 50 }
                    receivedAt: '2026-11-10T10:42:01Z'
                    deliveries:
                      - { subscriber: back, status: DELIVERED, attempts: 1, lastAttemptAt: '2026-11-10T10:42:01Z', lastStatusCode: 200 }
                      - { subscriber: stud, status: DELIVERED, attempts: 1, lastAttemptAt: '2026-11-10T10:42:01Z', lastStatusCode: 200 }
                      - { subscriber: admin, status: RETRYING, attempts: 2, lastAttemptAt: '2026-11-10T10:42:11Z', lastStatusCode: 503, nextAttemptAt: '2026-11-10T10:43:11Z' }
                pagination: { page: 1, pageSize: 20, totalItems: 1, totalPages: 1 }
            application/x-ndjson:
              schema: { type: string }
              example: |
                {"event":{"id":"0b6c2f0e-6a4b-4a43-9d3c-2a6f8f0c1d11","type":"sale.recorded","source":"rms","association":"cnamus"},"receivedAt":"2026-11-10T10:42:01Z"}
        '401': { $ref: './common/schemas.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common/schemas.yaml#/components/responses/Forbidden' }

  /api/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/LoggedEventId'
    get:
      tags: [Événements]
      operationId: getEvent
      summary: Lire un événement du journal
      description: L'événement tel que publié et l'état de ses livraisons.
      security:
        - bearerAuth: []
        - serviceApiKey: []
      responses:
        '200':
          description: L'événement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoggedEvent' }
              example:
                event:
                  id: 0b6c2f0e-6a4b-4a43-9d3c-2a6f8f0c1d11
                  type: sale.recorded
                  version: 1
                  source: rms
                  association: cnamus
                  occurredAt: '2026-11-10T10:42:00Z'
                  data: { saleId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d, totalCents: 50 }
                receivedAt: '2026-11-10T10:42:01Z'
                deliveries:
                  - { subscriber: back, status: DELIVERED, attempts: 1, lastAttemptAt: '2026-11-10T10:42:01Z', lastStatusCode: 200 }
        '401': { $ref: './common/schemas.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common/schemas.yaml#/components/responses/NotFound' }

  /api/events/{eventId}/deliveries:
    parameters:
      - $ref: '#/components/parameters/LoggedEventId'
    get:
      tags: [Événements]
      operationId: listEventDeliveries
      summary: Suivre les livraisons d'un événement
      description: |
        Une ligne par abonné. Calendrier des nouvelles tentatives après un échec :
        10 s, 1 min, 5 min, 30 min, 2 h, puis `FAILED`.
      security:
        - bearerAuth: []
        - serviceApiKey: []
      responses:
        '200':
          description: Livraisons.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Delivery' }
              example:
                - { subscriber: back, status: DELIVERED, attempts: 1, lastAttemptAt: '2026-11-10T10:42:01Z', lastStatusCode: 200 }
                - { subscriber: admin, status: FAILED, attempts: 6, lastAttemptAt: '2026-11-10T13:18:11Z', lastStatusCode: 500, lastError: Internal Server Error }
        '401': { $ref: './common/schemas.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './common/schemas.yaml#/components/responses/NotFound' }

  /api/events/{eventId}/redeliver:
    parameters:
      - $ref: '#/components/parameters/LoggedEventId'
    post:
      tags: [Événements]
      operationId: redeliverEvent
      summary: Rejouer un événement
      description: |
        Relivre l'événement à un abonné (ou à tous). Sans risque, car les abonnés ignorent
        un `id` déjà traité. Rôle `STUDRP_ADMIN`.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                subscriber: { $ref: './common/events.yaml#/components/schemas/ServiceName' }
            example: { subscriber: admin }
      responses:
        '202':
          description: Nouvelle livraison programmée.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Delivery' }
              example:
                - { subscriber: admin, status: PENDING, attempts: 6, lastAttemptAt: '2026-11-10T13:18:11Z', lastStatusCode: 500 }
        '401': { $ref: './common/schemas.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common/schemas.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common/schemas.yaml#/components/responses/NotFound' }

  /api/health:
    get:
      tags: [Santé]
      operationId: getGlobalHealth
      summary: État global du système
      description: Interroge le `GET /health` de chaque service (timeout 2 s) et agrège.
      security: []
      responses:
        '200':
          description: État de la gateway et de chaque service.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GlobalHealth' }
              example:
                status: DEGRADED
                services:
                  stud: { status: UP, latencyMs: 41 }
                  back: { status: UP, latencyMs: 63 }
                  rms: { status: UP, latencyMs: 38 }
                  admin: { status: DOWN, latencyMs: null }
                  money: { status: UP, latencyMs: 120 }
                checkedAt: '2026-11-10T11:00:00Z'

webhooks:
  association.created:
    post:
      tags:
      - Catalogue d'événements
      operationId: onAssociationCreated
      summary: Association créée
      description: '**Émetteur** : ADMIN · **Abonnés** : STUD, BACK, RMS, MONEY


        Une nouvelle association cliente est paramétrée. Chaque service crée son espace.

        '
      parameters:
      - $ref: ./common/events.yaml#/components/parameters/EventIdHeader
      - $ref: ./common/events.yaml#/components/parameters/EventTypeHeader
      - $ref: ./common/events.yaml#/components/parameters/SignatureHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./common/events.yaml#/components/schemas/AssociationEvent
            example:
              id: 0b6c2f0e-6a4b-4a43-9d3c-000000000000
              type: association.created
              version: 1
              source: admin
              association: cnamus
              occurredAt: '2026-11-10T10:42:00Z'
              correlationId: b2e4c6a8-1f0d-4c55-8a7e-3c9d2e1f0a77
              data:
                slug: cnamus
                displayName: CNAMUS
                status: ACTIVE
                commissionRate: 0.045
                defaultVatRate: 0.2
                overdraftLimitCents: 0
                membershipFeeCents: 1100
      responses:
        '200':
          $ref: ./common/events.yaml#/components/responses/EventAccepted
        '401':
          $ref: ./common/events.yaml#/components/responses/InvalidSignature
  association.updated:
    post:
      tags:
      - Catalogue d'événements
      operationId: onAssociationUpdated
      summary: Association modifiée
      description: '**Émetteur** : ADMIN · **Abonnés** : STUD, BACK, RMS, MONEY


        Nom, marque blanche ou paramètres (commission, TVA, découvert, cotisation) modifiés.

        '
      parameters:
      - $ref: ./common/events.yaml#/components/parameters/EventIdHeader
      - $ref: ./common/events.yaml#/components/parameters/EventTypeHeader
      - $ref: ./common/events.yaml#/components/parameters/SignatureHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./common/events.yaml#/components/schemas/AssociationEvent
            example:
              id: 0b6c2f0e-6a4b-4a43-9d3c-000000000001
              type: association.updated
              version: 1
              source: admin
              association: cnamus
              occurredAt: '2026-11-10T10:42:00Z'
              correlationId: b2e4c6a8-1f0d-4c55-8a7e-3c9d2e1f0a77
              data:
                slug: cnamus
                displayName: CNAMUS
                status: ACTIVE
                commissionRate: 0.045
                defaultVatRate: 0.2
                overdraftLimitCents: 500
                membershipFeeCents: 1100
      responses:
        '200':
          $ref: ./common/events.yaml#/components/responses/EventAccepted
        '401':
          $ref: ./common/events.yaml#/components/responses/InvalidSignature
  student.created:
    post:
      tags:
      - Catalogue d'événements
      operationId: onStudentCreated
      summary: Nouveau contact
      description: '**Émetteur** : STUD · **Abonnés** : BACK


        Un contact est créé dans STUD. BACK ouvre son sous-compte 411.

        '
      parameters:
      - $ref: ./common/events.yaml#/components/parameters/EventIdHeader
      - $ref: ./common/events.yaml#/components/parameters/EventTypeHeader
      - $ref: ./common/events.yaml#/components/parameters/SignatureHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./common/events.yaml#/components/schemas/StudentEvent
            example:
              id: 0b6c2f0e-6a4b-4a43-9d3c-000000000002
              type: student.created
              version: 1
              source: stud
              association: cnamus
              occurredAt: '2026-11-10T10:42:00Z'
              correlationId: b2e4c6a8-1f0d-4c55-8a7e-3c9d2e1f0a77
              data:
                studentId: 3f1c2a8e-7b6d-4e15-9c4a-1d2e3f4a5b6c
                memberNumber: CNAMUS-2027-0042
                displayName: Léa M.
                memberType: STUDENT
                membershipStatus: NONE
      responses:
        '200':
          $ref: ./common/events.yaml#/components/responses/EventAccepted
        '401':
          $ref: ./common/events.yaml#/components/responses/InvalidSignature
  student.updated:
    post:
      tags:
      - Catalogue d'événements
      operationId: onStudentUpdated
      summary: Contact modifié
      description: '**Émetteur** : STUD · **Abonnés** : BACK


        Changement de statut d''adhésion ou de type d''adhérent.

        '
      parameters:
      - $ref: ./common/events.yaml#/components/parameters/EventIdHeader
      - $ref: ./common/events.yaml#/components/parameters/EventTypeHeader
      - $ref: ./common/events.yaml#/components/parameters/SignatureHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./common/events.yaml#/components/schemas/StudentEvent
            example:
              id: 0b6c2f0e-6a4b-4a43-9d3c-000000000003
              type: student.updated
              version: 1
              source: stud
              association: cnamus
              occurredAt: '2026-11-10T10:42:00Z'
              correlationId: b2e4c6a8-1f0d-4c55-8a7e-3c9d2e1f0a77
              data:
                studentId: 3f1c2a8e-7b6d-4e15-9c4a-1d2e3f4a5b6c
                memberNumber: CNAMUS-2027-0042
                displayName: Léa M.
                memberType: STUDENT
                membershipStatus: UP_TO_DATE
      responses:
        '200':
          $ref: ./common/events.yaml#/components/responses/EventAccepted
        '401':
          $ref: ./common/events.yaml#/components/responses/InvalidSignature
  student.anonymized:
    post:
      tags:
      - Catalogue d'événements
      operationId: onStudentAnonymized
      summary: Contact anonymisé (RGPD)
      description: '**Émetteur** : STUD · **Abonnés** : BACK, RMS, ADMIN


        Droit à l''effacement exercé. Chaque abonné efface le nom de ses copies ; les écritures restent.

        '
      parameters:
      - $ref: ./common/events.yaml#/components/parameters/EventIdHeader
      - $ref: ./common/events.yaml#/components/parameters/EventTypeHeader
      - $ref: ./common/events.yaml#/components/parameters/SignatureHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./common/events.yaml#/components/schemas/StudentAnonymizedEvent
            example:
              id: 0b6c2f0e-6a4b-4a43-9d3c-000000000004
              type: student.anonymized
              version: 1
              source: stud
              association: cnamus
              occurredAt: '2026-11-10T10:42:00Z'
              correlationId: b2e4c6a8-1f0d-4c55-8a7e-3c9d2e1f0a77
              data:
                studentId: 3f1c2a8e-7b6d-4e15-9c4a-1d2e3f4a5b6c
      responses:
        '200':
          $ref: ./common/events.yaml#/components/responses/EventAccepted
        '401':
          $ref: ./common/events.yaml#/components/responses/InvalidSignature
  membership.paid:
    post:
      tags:
      - Catalogue d'événements
      operationId: onMembershipPaid
      summary: Cotisation réglée
      description: '**Émetteur** : STUD · **Abonnés** : BACK


        La cotisation annuelle est payée. Pour BACK c''est une vente (411 / 706).

        '
      parameters:
      - $ref: ./common/events.yaml#/components/parameters/EventIdHeader
      - $ref: ./common/events.yaml#/components/parameters/EventTypeHeader
      - $ref: ./common/events.yaml#/components/parameters/SignatureHeader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./common/events.yaml#/components/schemas/MembershipPaidEvent
            example:
              id: 0b6c2f0e-6a4b-4a43-9d3c-000000000005
              type: membership.paid
              version: 1
              source: stud
              association: cnamus
              occurredAt: '2026-11-10T10:42:00Z'
              correlationId: b2e4c6a8-1f0d-4c55-8a7e-3c9d2e1f0a77
              data:
                membershipId: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
                studentId: 3f1c2a8e-7b6d-4e15-9c4a-1d2e3f4a5b6c
                season: 2026-2027
                amountCents: 1100
                paymentId: 6f7a8b9c-0d1e-4f2a-9b3c-4d5e6f7a8b9c
      responses:
        '200':
          $ref: ./common/events.yaml#/components/responses/EventAccepted
        '401':
          $ref: ./common/events.yaml#/components/responses/InvalidSignature
