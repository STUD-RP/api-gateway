components:
  securitySchemes:
    bearerAuth: { $ref: './common/schemas.yaml#/components/securitySchemes/bearerAuth' }
    serviceApiKey: { $ref: './common/schemas.yaml#/components/securitySchemes/serviceApiKey' }
  parameters:
    LoggedEventId:
      name: eventId
      in: path
      required: true
      description: Identifiant de l'événement STUD'RP (champ `id` de l'enveloppe).
      schema: { $ref: './common/schemas.yaml#/components/schemas/Uuid' }
  schemas:
    LoginRequest:
      type: object
      required: [association, email, password, realm]
      properties:
        association: { $ref: './common/schemas.yaml#/components/schemas/AssociationSlug' }
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
        realm:
          type: string
          description: '`student` (vérifié par STUD) ou `staff` (bureau et STUD''RP, vérifié par ADMIN).'
          enum: [student, staff]
    CurrentUser:
      type: object
      required: [userId, role, association, name]
      properties:
        userId: { $ref: './common/schemas.yaml#/components/schemas/Uuid' }
        role: { $ref: './common/schemas.yaml#/components/schemas/UserRole' }
        association: { $ref: './common/schemas.yaml#/components/schemas/AssociationSlug' }
        name: { type: string }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresIn: { type: integer, description: Durée de validité en secondes. }
        user: { $ref: '#/components/schemas/CurrentUser' }
    PublishAck:
      type: object
      required: [eventId, duplicate, subscribers]
      properties:
        eventId: { $ref: './common/schemas.yaml#/components/schemas/Uuid' }
        duplicate: { type: boolean }
        subscribers:
          type: array
          items: { $ref: './common/events.yaml#/components/schemas/ServiceName' }
    Delivery:
      type: object
      required: [subscriber, status, attempts]
      properties:
        subscriber: { $ref: './common/events.yaml#/components/schemas/ServiceName' }
        status: { type: string, enum: [PENDING, DELIVERED, RETRYING, FAILED] }
        attempts: { type: integer }
        lastAttemptAt: { type: [string, 'null'], format: date-time }
        lastStatusCode: { type: [integer, 'null'] }
        lastError: { type: [string, 'null'] }
        nextAttemptAt: { type: [string, 'null'], format: date-time }
    LoggedEvent:
      type: object
      required: [event, receivedAt, deliveries]
      properties:
        event: { $ref: './common/events.yaml#/components/schemas/EventEnvelope' }
        receivedAt: { type: string, format: date-time }
        deliveries:
          type: array
          items: { $ref: '#/components/schemas/Delivery' }
    ServiceHealth:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [UP, DOWN] }
        latencyMs: { type: [integer, 'null'] }
    GlobalHealth:
      type: object
      required: [status, services, checkedAt]
      properties:
        status:
          type: string
          description: '`UP` si tous les services répondent, `DEGRADED` sinon.'
          enum: [UP, DEGRADED]
        services:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ServiceHealth' }
        checkedAt: { type: string, format: date-time }
